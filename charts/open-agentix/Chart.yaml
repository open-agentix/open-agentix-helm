apiVersion: v2
name: open-agentix
description: >-
  open-agentix - the agentic platform. Control node (API, UI), worker, database migrations, a
  bundled PostgreSQL and hardened defaults (PodSecurity restricted, default-deny NetworkPolicies)
  for Kubernetes and EKS.
type: application
version: 0.2.1
appVersion: "0.1.0"
kubeVersion: ">=1.27.0-0"
home: https://openagentix.si
sources:
  - https://github.com/open-agentix/open-agentix
  - https://github.com/open-agentix/open-agentix-helm
keywords:
  - agents
  - mcp
  - llm
  - audit
  - policy
  - bedrock
maintainers:
  - name: agentix-zero
    email: info@openagentix.si
    url: https://github.com/agentix-zero
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "true"
  artifacthub.io/containsSecurityUpdates: "false"
