{{- range $component := list "api" "worker" }}
{{- $sa := index $.Values.serviceAccount $component }}
{{- if $sa.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "open-agentix.serviceAccountName" (list $ $component) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "open-agentix.labels" (list $ $component) | nindent 4 }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
