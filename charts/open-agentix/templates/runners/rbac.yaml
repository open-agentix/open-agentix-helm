{{- with .Values.runners.kubernetesJob }}
{{- if .enabled }}
# Prepared for v0.2: the worker creates one Job per run in the dedicated runs namespace and
# injects a per-run Secret (revoked after the run). No cluster-wide permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "open-agentix.componentName" (list $ "runner") }}
  namespace: {{ .namespace }}
  labels:
    {{- include "open-agentix.labels" (list $ "runner") | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "open-agentix.componentName" (list $ "runner") }}
  namespace: {{ .namespace }}
  labels:
    {{- include "open-agentix.labels" (list $ "runner") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "open-agentix.componentName" (list $ "runner") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "open-agentix.serviceAccountName" (list $ "worker") }}
    namespace: {{ $.Release.Namespace }}
---
# Identity of run Job pods: no API token, no RBAC. Annotate for IRSA if runs call Bedrock.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .jobServiceAccount.name }}
  namespace: {{ .namespace }}
  labels:
    {{- include "open-agentix.labels" (list $ "runner") | nindent 4 }}
  {{- with .jobServiceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
