{{- /*
Credentials the chart generates once and keeps: random values are created on the first install
and read back with `lookup` on every upgrade, so they never change. The Secret is annotated
`helm.sh/resource-policy: keep` so it survives `helm uninstall` (the kept database volume still
holds the old passwords). Under `helm template`/`--dry-run`/Argo CD `lookup` returns nothing and
fresh values are rendered: pass `existingSecret` references there instead.
*/ -}}
{{- $v := .Values -}}
{{- $name := include "open-agentix.generatedSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $old := dict -}}
{{- if $existing -}}{{- $old = default (dict) $existing.data -}}{{- end -}}
{{- $keys := list -}}
{{- if not $v.runToken.existingSecret -}}{{- $keys = append $keys "run-token-secret" -}}{{- end -}}
{{- if and $v.postgresql.enabled (not $v.postgresql.auth.existingSecret) -}}
{{- $keys = concat $keys (list "postgres-password" "app-password" "migrator-password") -}}
{{- end -}}
{{- if and $v.valkey.enabled (not $v.valkey.auth.existingSecret) -}}{{- $keys = append $keys "valkey-password" -}}{{- end -}}
{{- if and $v.auth.bootstrapAdmin.enabled (not $v.demo.enabled) (not $v.auth.bootstrapAdmin.existingSecret) -}}
{{- $keys = append $keys "bootstrap-admin-password" -}}
{{- end -}}
{{- if and $v.audit.signingKey.generate (not $v.audit.signingKey.existingSecret) -}}{{- $keys = append $keys "ed25519.pem" -}}{{- end -}}
{{- if $keys }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "open-agentix.labels" (list . "generated") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  {{- range $key := $keys }}
  {{- $value := "" }}
  {{- if hasKey $old $key }}
  {{- $value = index $old $key }}
  {{- else if eq $key "ed25519.pem" }}
  {{- $value = genPrivateKey "ed25519" | b64enc }}
  {{- else if eq $key "bootstrap-admin-password" }}
  {{- $value = randAlphaNum 24 | b64enc }}
  {{- else }}
  {{- $value = randAlphaNum 40 | b64enc }}
  {{- end }}
  {{ $key }}: {{ $value }}
  {{- end }}
{{- end }}
