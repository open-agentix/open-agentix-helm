{{- if and .Values.ui.enabled .Values.ui.pdb.enabled (gt (int .Values.ui.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "open-agentix.componentName" (list . "ui") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "open-agentix.labels" (list . "ui") | nindent 4 }}
spec:
  {{- if kindIs "invalid" .Values.ui.pdb.maxUnavailable }}
  minAvailable: {{ .Values.ui.pdb.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.ui.pdb.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "open-agentix.selectorLabels" (list . "ui") | nindent 6 }}
{{- end }}
