{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open-agentix.componentName" (list . "ui") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "open-agentix.labels" (list . "ui") | nindent 4 }}
  {{- include "open-agentix.annotations" . | nindent 2 }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "open-agentix.selectorLabels" (list . "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "open-agentix.labels" (list . "ui") | nindent 8 }}
        {{- with .Values.ui.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.ui.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- include "open-agentix.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml (merge (dict "runAsUser" .Values.ui.runAsUser "runAsGroup" .Values.ui.runAsUser "fsGroup" .Values.ui.runAsUser) (deepCopy .Values.podSecurityContext)) | nindent 8 }}
      {{- include "open-agentix.scheduling" (list . "ui") | nindent 6 }}
      containers:
        - name: ui
          image: {{ include "open-agentix.image" (list . "ui") | quote }}
          imagePullPolicy: {{ include "open-agentix.pullPolicy" . }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.containerPort }}
              protocol: TCP
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- with .Values.ui.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ui.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            # nginx-unprivileged writes its pid and temp files here (read-only root fs).
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
