{{- if .Values.gateway.enabled }}
{{- include "open-agentix.validate" . }}
{{- $api := include "open-agentix.componentName" (list . "api") }}
{{- $ui := include "open-agentix.componentName" (list . "ui") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "open-agentix.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "open-agentix.labels" (list .) | nindent 4 }}
  {{- with (merge (deepCopy .Values.gateway.annotations) .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames:
    {{- range (default (list .Values.ingress.host) .Values.gateway.hostnames) }}
    - {{ . | quote }}
    {{- end }}
  rules:
    {{- if .Values.ui.enabled }}
    - matches:
        {{- range .Values.ingress.apiPaths }}
        - path: { type: PathPrefix, value: {{ . }} }
        {{- end }}
      backendRefs:
        - name: {{ $api }}
          port: {{ .Values.api.service.port }}
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: {{ $ui }}
          port: {{ .Values.ui.service.port }}
    {{- else }}
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: {{ $api }}
          port: {{ .Values.api.service.port }}
    {{- end }}
{{- end }}
