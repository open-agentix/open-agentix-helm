{{- if and .Values.networkPolicy.enabled .Values.postgresql.enabled }}
# The bundled PostgreSQL accepts connections only from api, worker, the migrations Job and the
# backup job, and has no egress at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "open-agentix.componentName" (list . "postgresql") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "open-agentix.labels" (list . "postgresql") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "open-agentix.selectorLabels" (list . "postgresql") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- range list "api" "worker" "migrations" "postgresql-backup" }}
        - podSelector:
            matchLabels:
              {{- include "open-agentix.selectorLabels" (list $ .) | nindent 14 }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 5432 }
  egress: []
{{- end }}
