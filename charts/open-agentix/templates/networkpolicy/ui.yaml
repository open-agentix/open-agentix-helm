{{- if and .Values.networkPolicy.enabled .Values.ui.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "open-agentix.componentName" (list . "ui") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "open-agentix.labels" (list . "ui") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "open-agentix.selectorLabels" (list . "ui") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingress.from | nindent 8 }}
      ports:
        - { protocol: TCP, port: {{ .Values.ui.containerPort }} }
  # Static files only: no egress at all.
  egress: []
{{- end }}
