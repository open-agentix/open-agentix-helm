{{- if .Values.networkPolicy.enabled }}
# Default deny: every pod of this release (api, worker, ui, migrations) starts with no ingress
# and no egress; the policies next to this file open exactly what each component needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "open-agentix.componentName" (list . "default-deny") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "open-agentix.labels" (list .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "open-agentix.selectorLabels" (list .) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
{{- end }}
