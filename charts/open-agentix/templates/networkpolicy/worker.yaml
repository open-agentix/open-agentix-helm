{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "open-agentix.componentName" (list . "worker") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "open-agentix.labels" (list . "worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "open-agentix.selectorLabels" (list . "worker") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # No ingress: the worker pulls work from the queue.
  ingress: []
  egress:
    {{- include "open-agentix.netpol.dns" . | nindent 4 }}
    {{- include "open-agentix.netpol.database" . | nindent 4 }}
    {{- include "open-agentix.netpol.cache" . | nindent 4 }}
    # Control node API (policy gate / run-token channel).
    - to:
        - podSelector:
            matchLabels:
              {{- include "open-agentix.selectorLabels" (list . "api") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 8080 }
    {{- include "open-agentix.netpol.rules" $np.egress.otel | nindent 4 }}
    {{- include "open-agentix.netpol.rules" $np.egress.providers | nindent 4 }}
    {{- include "open-agentix.netpol.rules" $np.egress.mcp | nindent 4 }}
    {{- include "open-agentix.netpol.rules" $np.egress.eventSources | nindent 4 }}
    {{- if .Values.runners.kubernetesJob.enabled }}
    {{- include "open-agentix.netpol.rules" $np.egress.kubernetesApi | nindent 4 }}
    {{- end }}
{{- end }}
