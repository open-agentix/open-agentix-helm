{{- if and .Values.networkPolicy.enabled .Values.migrations.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "open-agentix.componentName" (list . "migrations") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "open-agentix.labels" (list . "migrations") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "open-agentix.selectorLabels" (list . "migrations") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    {{- include "open-agentix.netpol.dns" . | nindent 4 }}
    {{- include "open-agentix.netpol.database" . | nindent 4 }}
{{- end }}
