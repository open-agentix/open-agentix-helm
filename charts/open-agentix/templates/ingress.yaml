{{- if .Values.ingress.enabled }}
{{- $api := include "open-agentix.componentName" (list . "api") }}
{{- $ui := include "open-agentix.componentName" (list . "ui") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "open-agentix.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "open-agentix.labels" (list .) | nindent 4 }}
  {{- with (merge (deepCopy .Values.ingress.annotations) .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.ui.enabled }}
          {{- range .Values.ingress.apiPaths }}
          - path: {{ . }}
            pathType: {{ $.Values.ingress.pathType }}
            backend:
              service:
                name: {{ $api }}
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $ui }}
                port:
                  name: http
          {{- else }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $api }}
                port:
                  name: http
          {{- end }}
{{- end }}
