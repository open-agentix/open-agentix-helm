suite: generated secret
templates:
  - secret-generated.yaml
release:
  name: rel
  namespace: oax
capabilities:
  majorVersion: 1
  minorVersion: 34
tests:
  - it: generates every credential of the default install once and keeps the Secret on uninstall
    asserts:
      - isKind: { of: Secret }
      - equal: { path: metadata.name, value: rel-open-agentix-generated }
      - equal: { path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep }
      - exists: { path: 'data["run-token-secret"]' }
      - exists: { path: 'data["postgres-password"]' }
      - exists: { path: 'data["app-password"]' }
      - exists: { path: 'data["migrator-password"]' }
      - exists: { path: 'data["bootstrap-admin-password"]' }
      - exists: { path: 'data["ed25519.pem"]' }
      - notExists: { path: 'data["valkey-password"]' }

  - it: adds the Valkey password
    set:
      valkey.enabled: true
    asserts:
      - exists: { path: 'data["valkey-password"]' }

  - it: generates a PKCS#8 Ed25519 key
    asserts:
      - matchRegex: { path: 'data["ed25519.pem"]', pattern: '^[A-Za-z0-9+/=]{80,}$' }

  - it: keeps previously generated values (lookup) and fills in new keys
    kubernetesProvider:
      scheme:
        v1/Secret:
          gvr: { group: "", version: v1, resource: secrets }
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata: { name: rel-open-agentix-generated, namespace: oax }
          data:
            run-token-secret: b2xkLXJ1bi10b2tlbg==
            app-password: b2xkLWFwcA==
    asserts:
      - equal: { path: 'data["run-token-secret"]', value: b2xkLXJ1bi10b2tlbg== }
      - equal: { path: 'data["app-password"]', value: b2xkLWFwcA== }
      - exists: { path: 'data["migrator-password"]' }

  - it: renders nothing when every credential comes from an existing Secret
    set:
      postgresql.enabled: false
      externalDatabase.host: db.example.com
      externalDatabase.existingSecret: oax-db
      runToken.existingSecret: oax-run-token
      auth.bootstrapAdmin.enabled: false
      audit.signingKey.generate: false
    asserts:
      - hasDocuments: { count: 0 }

  - it: skips the admin password in demo mode and the key with an existing Secret
    set:
      demo.enabled: true
      audit.signingKey.existingSecret: oax-audit
    asserts:
      - notExists: { path: 'data["bootstrap-admin-password"]' }
      - notExists: { path: 'data["ed25519.pem"]' }
