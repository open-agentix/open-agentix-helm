suite: service accounts
templates:
  - serviceaccount.yaml
values:
  - values/base.yaml
release:
  name: rel
  namespace: oax
capabilities:
  majorVersion: 1
  minorVersion: 34
tests:
  - it: creates token-less ServiceAccounts for api and worker
    asserts:
      - hasDocuments: { count: 2 }
      - equal: { path: metadata.name, value: rel-open-agentix-api }
        documentIndex: 0
      - equal: { path: metadata.name, value: rel-open-agentix-worker }
        documentIndex: 1
      - equal: { path: automountServiceAccountToken, value: false }

  - it: carries the IRSA role annotation
    set:
      serviceAccount.worker.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/bedrock
    asserts:
      - equal:
          path: 'metadata.annotations["eks.amazonaws.com/role-arn"]'
          value: arn:aws:iam::123456789012:role/bedrock
        documentIndex: 1

  - it: skips creation when disabled
    set:
      serviceAccount.api.create: false
      serviceAccount.worker.create: false
    asserts:
      - hasDocuments: { count: 0 }
