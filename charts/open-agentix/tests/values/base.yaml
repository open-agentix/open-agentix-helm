# Smallest valid configuration with an external database; used by most unit tests. The
# bundled-by-default behaviour has its own suites (bundled_*_test.yaml) that use values/bundled.yaml.
postgresql:
  enabled: false
auth:
  bootstrapAdmin:
    enabled: false
audit:
  signingKey:
    generate: false
ui:
  enabled: false
runToken:
  existingSecret: oax-run-token
externalDatabase:
  host: db.example.com
  existingSecret: oax-db
