# Minimal install: nothing is required. The chart brings its own PostgreSQL, generates every
# secret once (run token, database passwords, audit signing key, local admin password) and uses
# the simulated model provider. Install with:
#   helm install oax ./charts/open-agentix -n openagentix --create-namespace
# Everything below is optional.
auth:
  bootstrapAdmin:
    email: admin@example.com
