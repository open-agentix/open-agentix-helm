# Amazon EKS: IRSA for Bedrock, AWS Load Balancer Controller (ALB), Bedrock through a VPC
# interface endpoint, Amazon RDS for PostgreSQL, ElastiCache (Valkey), OIDC login and
# Prometheus Operator. Replace every <...> placeholder. See docs/eks.md.
# Secrets (oax-db, oax-db-migrator, oax-cache, oax-oidc, ...) come from External Secrets or
# `kubectl create secret`; the run token and the audit key may also be left to the chart.
image:
  api:
    tag: "0.1.0"
    # digest: sha256:<api digest>
  worker:
    tag: "0.1.0"
    # digest: sha256:<worker digest>

config:
  logLevel: info
  providers:
    - kind: simulated
      name: simulated
  priceTable:
    - provider: bedrock
      model: "anthropic.claude-*"
      inputPerMTok: 3
      outputPerMTok: 15

# Production: no bundled database.
postgresql:
  enabled: false

externalDatabase:
  host: openagentix.cluster-abcdefghijkl.eu-central-1.rds.amazonaws.com
  port: 5432
  database: openagentix
  user: openagentix_app
  sslmode: verify-full
  existingSecret: oax-db
  migrations:
    user: openagentix_migrator
    existingSecret: oax-db-migrator

cache:
  enabled: true
  existingSecret: oax-cache
  urlKey: url

runToken:
  existingSecret: oax-run-token

audit:
  signingKey:
    existingSecret: oax-audit-signing-key
    keyId: "2026-10"

auth:
  oidc:
    enabled: true
    issuer: https://login.microsoftonline.com/<tenant-id>/v2.0
    clientId: <client-id>
    existingSecret: oax-oidc
    roleMapping:
      openagentix-admins: admin
      openagentix-engineers: agent-engineer
      openagentix-auditors: auditor

aws:
  region: eu-central-1
  bedrock:
    enabled: true
    vpcEndpointUrl: https://vpce-0123456789abcdef0-abcdefgh.bedrock-runtime.eu-central-1.vpce.amazonaws.com
    clearance: confidential

serviceAccount:
  api:
    annotations: {}
  worker:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/openagentix-bedrock-invoke

api:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
  resources:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { memory: 768Mi }

worker:
  concurrency: 8
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10

ingress:
  enabled: true
  className: alb
  host: agents.example.com
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-central-1:123456789012:certificate/<id>
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
  tls:
    # ALB terminates TLS with the ACM certificate; no Kubernetes TLS Secret needed.
    enabled: true
    secretName: ""

networkPolicy:
  enabled: true
  ingress:
    # ALB in IP mode connects from the VPC subnets.
    from:
      - ipBlock: { cidr: 10.20.0.0/16 }
    metricsFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
  egress:
    database:
      - ipBlock: { cidr: 10.20.32.0/20 }
    cache:
      - ipBlock: { cidr: 10.20.32.0/20 }
    otel:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: observability
        ports:
          - { protocol: TCP, port: 4318 }
    auth:
      # OIDC issuer (Entra ID) through the egress proxy.
      - to:
          - ipBlock: { cidr: 10.20.48.10/32 }
        ports:
          - { protocol: TCP, port: 3128 }
    providers:
      # Interface endpoints for bedrock-runtime and sts (IRSA) in the private subnets.
      - to:
          - ipBlock: { cidr: 10.20.64.0/22 }
        ports:
          - { protocol: TCP, port: 443 }

proxy:
  # Used by the API for the OIDC issuer; Bedrock goes through the VPC endpoint (NO_PROXY).
  httpsProxy: http://10.20.48.10:3128
  noProxy: ".amazonaws.com,10.20.0.0/16"

observability:
  otel:
    endpoint: http://otel-collector.observability.svc:4318
    # In-cluster plaintext collector: only inside a trusted network; prefer mTLS.
    # Without this the platform refuses a non-loopback http:// endpoint at start-up.
    insecure: true
  metrics:
    existingSecret: oax-metrics
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  prometheusRule:
    enabled: true
    labels:
      release: kube-prometheus-stack
