name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART: charts/open-agentix
  HELM_VERSION: v3.22.0
  HELM_UNITTEST_VERSION: v1.2.1
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  KUBE_VERSION: 1.34.0

jobs:
  static:
    name: structure, schema, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tools (pinned)
        run: |
          python3 -m pip install --user pyyaml==6.0.2
          npm install --no-save --prefix "$RUNNER_TEMP/node" ajv@8.17.1 yaml@2.8.1
      - name: template structure
        run: python3 scripts/check-templates.py "$CHART"
      - name: values files against values.schema.json
        env:
          NODE_PATH: ${{ runner.temp }}/node/node_modules
        run: node scripts/validate-values.cjs "$CHART" examples/*.yaml "$CHART"/ci/*.yaml tests/values/*.yaml
      - name: chart README values table is up to date
        run: python3 scripts/values-table.py --check "$CHART/README.md"
      - name: unit test template coverage (>= 80 %)
        run: |
          python3 scripts/coverage.py "$CHART" --min 80 --markdown "$RUNNER_TEMP/coverage.md"
          cat "$RUNNER_TEMP/coverage.md" >> "$GITHUB_STEP_SUMMARY"

  lint-template:
    name: helm lint, template, golden files, kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: helm lint
        run: |
          for f in examples/*.yaml "$CHART"/ci/*.yaml tests/values/*.yaml; do
            echo "::group::$f"; helm lint "$CHART" --strict -f "$f"; echo "::endgroup::"
          done
      - name: install kubeconform (pinned, checksum verified)
        run: |
          curl -fsSLo "$RUNNER_TEMP/kc.tgz" "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/kc.tgz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/kc.tgz" -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: golden files
        id: golden
        run: |
          set +e
          scripts/golden.sh
          rc=$?
          if [ $rc -eq 2 ]; then
            echo "::warning::No golden files committed yet - download the golden-candidate artifact, review and commit it to tests/golden/."
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $rc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: golden-candidate
          path: .out/golden-candidate/
          retention-days: 14
      - name: kubeconform (strict, pinned schemas)
        run: scripts/kubeconform.sh .out/golden-candidate/*.yaml

  unittest:
    name: helm-unittest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: d3adb5/helm-unittest-action@985d798b675caa501251573380b5e026ff768c50 # v2.5.1
        with:
          helm-version: ${{ env.HELM_VERSION }}
          unittest-version: ${{ env.HELM_UNITTEST_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          charts: ${{ env.CHART }}
          flags: --strict --color

  chart-testing:
    name: chart-testing (lint; install on kind once images are published)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
      - name: ct lint
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ct lint --config ct.yaml --check-version-increment=true
          else
            ct lint --config ct.yaml --all --check-version-increment=false
          fi
      # The install test needs the platform images on ghcr.io. Until they are published the
      # repository variable OAX_IMAGES_PUBLISHED stays unset and the chart is tested by
      # rendering only (lint-template, unittest).
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        if: vars.OAX_IMAGES_PUBLISHED == 'true'
      - name: prepare the PodSecurity restricted namespace
        if: vars.OAX_IMAGES_PUBLISHED == 'true'
        run: |
          # Default values: bundled PostgreSQL, generated secrets. Nothing else to prepare.
          kubectl create namespace oax-ci
          kubectl label namespace oax-ci pod-security.kubernetes.io/enforce=restricted
      - name: ct install
        if: vars.OAX_IMAGES_PUBLISHED == 'true'
        run: ct install --config ct.yaml --all

  commits:
    name: Conventional Commits and DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .{1,100}$' \
            || { echo "PR title must follow Conventional Commits: $TITLE"; exit 1; }
      - name: commit subjects and sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            subject=$(git log -1 --format=%s "$c")
            echo "$subject" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .{1,100}$' \
              || { echo "::error::$c is not a Conventional Commit: $subject"; status=1; }
            git log -1 --format=%B "$c" | grep -q '^Signed-off-by: ' \
              || { echo "::error::$c has no DCO sign-off"; status=1; }
          done
          exit $status
