# Source: open-agentix/templates/postgresql/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: oax-open-agentix-postgresql-init
  namespace: openagentix
  labels:
    helm.sh/chart: open-agentix-0.2.1
    app.kubernetes.io/name: open-agentix
    app.kubernetes.io/instance: oax
    app.kubernetes.io/component: postgresql
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: open-agentix
  
data:
  # Runs once on an empty data directory (docker-entrypoint-initdb.d). Creates the migration
  # owner and the least-privilege application role (see the platform's deploy/sql/roles.sql).
  10-roles.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
      -v migrator_user="openagentix_migrator" -v app_user="openagentix_app" \
      -v dbname="openagentix" \
      -v migrator_pw="$OAX_MIGRATOR_PASSWORD" -v app_pw="$OAX_APP_PASSWORD" <<'SQL'
    CREATE ROLE :"migrator_user" LOGIN PASSWORD :'migrator_pw';
    CREATE ROLE :"app_user" LOGIN PASSWORD :'app_pw';
    CREATE DATABASE :"dbname" OWNER :"migrator_user";
    REVOKE ALL ON DATABASE :"dbname" FROM PUBLIC;
    GRANT CONNECT ON DATABASE :"dbname" TO :"app_user";
    \connect :"dbname"
    GRANT USAGE ON SCHEMA public TO :"app_user";
    ALTER DEFAULT PRIVILEGES FOR ROLE :"migrator_user" IN SCHEMA public
      GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO :"app_user";
    ALTER DEFAULT PRIVILEGES FOR ROLE :"migrator_user" IN SCHEMA public
      GRANT USAGE, SELECT ON SEQUENCES TO :"app_user";
    SQL
