# Source: open-agentix/templates/networkpolicy/worker.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oax-open-agentix-worker
  namespace: openagentix
  labels:
    helm.sh/chart: open-agentix-0.1.1
    app.kubernetes.io/name: open-agentix
    app.kubernetes.io/instance: oax
    app.kubernetes.io/component: worker
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: open-agentix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: open-agentix
      app.kubernetes.io/instance: oax
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
    - Egress
  # No ingress: the worker pulls work from the queue.
  ingress: []
  egress:
    
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    
    -
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
      ports:
        - { protocol: TCP, port: 5432 }
    
    # Control node API (policy gate / run-token channel).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: open-agentix
              app.kubernetes.io/instance: oax
              app.kubernetes.io/component: api
      ports:
        - { protocol: TCP, port: 8080 }
    
    
    -
      ports:
      - port: 11434
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ollama
