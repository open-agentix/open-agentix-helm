apiVersion: batch/v1
kind: CronJob
metadata:
  name: oax-open-agentix-postgresql-backup
  namespace: openagentix
  labels:
    helm.sh/chart: open-agentix-0.2.1
    app.kubernetes.io/name: open-agentix
    app.kubernetes.io/instance: oax
    app.kubernetes.io/component: postgresql-backup
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: open-agentix
  
spec:
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            helm.sh/chart: open-agentix-0.2.1
            app.kubernetes.io/name: open-agentix
            app.kubernetes.io/instance: oax
            app.kubernetes.io/component: postgresql-backup
            app.kubernetes.io/version: "0.1.0"
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/part-of: open-agentix
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          
          imagePullSecrets:
            - name: internal-registry
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: "registry.internal.example/library/postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea"
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
                - |
                  ts=$(date -u +%Y%m%dT%H%M%SZ)
                  out="/backups/${PGDATABASE}-${ts}.dump"
                  pg_dump --format=custom --no-owner --file "${out}.partial"
                  mv "${out}.partial" "${out}"
                  echo "wrote ${out} ($(wc -c < "${out}") bytes)"
                  find /backups -maxdepth 1 -name "${PGDATABASE}-*.dump" -mtime "+14" -print -delete
              env:
                - name: PGHOST
                  value: "oax-open-agentix-postgresql"
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: "openagentix_migrator"
                - name: PGDATABASE
                  value: "openagentix"
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: "oax-open-agentix-generated", key: "migrator-password" } }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: oax-open-agentix-postgresql-backup
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
