# Source: open-agentix/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oax-open-agentix
  namespace: openagentix
  labels:
    helm.sh/chart: open-agentix-0.1.1
    app.kubernetes.io/name: open-agentix
    app.kubernetes.io/instance: oax
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: open-agentix
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "agents.internal.example"
      secretName: agents-internal-tls
  rules:
    - host: "agents.internal.example"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oax-open-agentix-api
                port:
                  name: http
