# Source: open-agentix/templates/networkpolicy/api.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oax-open-agentix-api
  namespace: openagentix
  labels:
    helm.sh/chart: open-agentix-0.1.1
    app.kubernetes.io/name: open-agentix
    app.kubernetes.io/instance: oax
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: open-agentix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: open-agentix
      app.kubernetes.io/instance: oax
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Ingress controller / load balancer.
    - from:
        - ipBlock:
            cidr: 10.20.0.0/16
      ports:
        - { protocol: TCP, port: 8080 }
    # Worker pods (run-token channel for remote workers).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: open-agentix
              app.kubernetes.io/instance: oax
              app.kubernetes.io/component: worker
      ports:
        - { protocol: TCP, port: 8080 }
    # Prometheus scraping /metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    
    -
      to:
        - ipBlock:
            cidr: 10.20.32.0/20
      ports:
        - { protocol: TCP, port: 5432 }
    
    -
      to:
        - ipBlock:
            cidr: 10.20.32.0/20
      ports:
        - { protocol: TCP, port: 6379 }
    
    -
      ports:
      - port: 4318
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: observability
    
    -
      ports:
      - port: 3128
        protocol: TCP
      to:
      - ipBlock:
          cidr: 10.20.48.10/32
