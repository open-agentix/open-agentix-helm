# Source: open-agentix/templates/monitoring/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: oax-open-agentix
  namespace: openagentix
  labels:
    helm.sh/chart: open-agentix-0.1.1
    app.kubernetes.io/name: open-agentix
    app.kubernetes.io/instance: oax
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: open-agentix
    release: kube-prometheus-stack
spec:
  groups:
    - name: open-agentix
      rules:
        - alert: OpenAgentixApiDown
          expr: absent(up{job="oax-open-agentix-api", namespace="openagentix"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: No open-agentix API instance is up in openagentix.
        - alert: OpenAgentixApiErrorRate
          expr: |
            sum(rate(oax_http_request_duration_seconds_count{job="oax-open-agentix-api", namespace="openagentix", status=~"5.."}[5m]))
              / clamp_min(sum(rate(oax_http_request_duration_seconds_count{job="oax-open-agentix-api", namespace="openagentix"}[5m])), 1e-9)
              > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: More than 5 % of API requests fail with 5xx.
        - alert: OpenAgentixApiLatencyHigh
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(oax_http_request_duration_seconds_bucket{job="oax-open-agentix-api", namespace="openagentix"}[5m])))
              > 0.5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: API p95 latency is above 0.5 s.
        - alert: OpenAgentixRunQueueBacklog
          expr: max(oax_runs_by_status{job="oax-open-agentix-api", namespace="openagentix", status="queued"}) > 100
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: More than 100 runs are queued; scale the worker.
