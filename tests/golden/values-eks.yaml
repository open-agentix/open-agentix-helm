    -
      to:
        - ipBlock:
            cidr: 10.20.32.0/20
      ports:
        - { protocol: TCP, port: 6379 }
    # Control node API (policy gate / run-token channel).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: open-agentix
              app.kubernetes.io/instance: oax
              app.kubernetes.io/component: api
      ports:
        - { protocol: TCP, port: 8080 }
    
    -
      ports:
      - port: 4318
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: observability
    
    -
      ports:
      - port: 443
        protocol: TCP
      to:
      - ipBlock:
          cidr: 10.20.64.0/22
