      app.kubernetes.io/name: open-agentix
      app.kubernetes.io/instance: oax
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
    - Egress
  # No ingress: the worker pulls work from the queue.
  ingress: []
  egress:
    
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    
    -
      ports:
        - { protocol: TCP, port: 5432 }
    
    # Control node API (policy gate / run-token channel).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: open-agentix
              app.kubernetes.io/instance: oax
              app.kubernetes.io/component: api
      ports:
        - { protocol: TCP, port: 8080 }
