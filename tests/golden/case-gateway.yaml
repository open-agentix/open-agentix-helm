# Source: open-agentix/templates/api/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oax-open-agentix-api
  namespace: openagentix
  labels:
    helm.sh/chart: open-agentix-0.2.1
    app.kubernetes.io/name: open-agentix
    app.kubernetes.io/instance: oax
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: open-agentix
  
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-agentix
      app.kubernetes.io/instance: oax
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        helm.sh/chart: open-agentix-0.2.1
        app.kubernetes.io/name: open-agentix
        app.kubernetes.io/instance: oax
        app.kubernetes.io/component: api
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: open-agentix
    spec:
      serviceAccountName: oax-open-agentix-api
      automountServiceAccountToken: false
      
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: open-agentix
              app.kubernetes.io/instance: oax
              app.kubernetes.io/component: api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: open-agentix
              app.kubernetes.io/instance: oax
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: "ghcr.io/open-agentix/open-agentix-api:0.1.0"
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/main.js"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: OAX_HOST
              value: "0.0.0.0"
            - name: OAX_PORT
              value: "8080"
            - name: NODE_ENV
              value: production
            - name: OAX_LOG_LEVEL
              value: "info"
            - name: OAX_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: "oax-db", key: "password" } }
            - name: OAX_DATABASE_URL
              value: "postgres://openagentix_app:$(OAX_DB_PASSWORD)@db.example.com:5432/openagentix?sslmode=require"
            - name: OAX_DB_POOL_MAX
              value: "20"
            - name: OAX_DB_STATEMENT_TIMEOUT_MS
              value: "15000"
            - name: OAX_DB_MIGRATE_ON_START
              value: "false"
            - name: OAX_PUBLIC_URL
              value: "https://agents.example.com"
            - name: OAX_UI_URL
              value: "https://agents.example.com"
            - name: OAX_TRUST_PROXY
              value: "true"
            - name: OAX_BODY_LIMIT_BYTES
              value: "1048576"
            - name: OAX_CACHE_MAX_ENTRIES
              value: "10000"
            - name: OAX_AUTH_CACHE_TTL_SECONDS
              value: "30"
            - name: OAX_SESSION_TTL_SECONDS
              value: "28800"
            - name: OAX_TOKEN_MAX_TTL_DAYS
              value: "365"
            - name: OAX_RATE_LIMIT_MAX
              value: "600"
            - name: OAX_RATE_LIMIT_LOGIN_MAX
              value: "10"
            - name: OAX_BOOTSTRAP_ADMIN_EMAIL
              value: "admin@openagentix.local"
            - name: OAX_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: "oax-open-agentix-generated", key: "bootstrap-admin-password" }
            - name: OAX_AUDIT_SIGNING_KEY
              valueFrom:
                secretKeyRef: { name: "oax-open-agentix-generated", key: "ed25519.pem" }
            - name: OAX_AUDIT_SIGNING_KEY_ID
              value: "default"
            - name: OAX_AUDIT_PUBLIC_KEYS
              value: "{}"
            - name: OAX_AUDIT_CHECKPOINT_EVERY
              value: "1000"
            - name: OAX_RUN_TOKEN_SECRET
              valueFrom:
                secretKeyRef: { name: "oax-open-agentix-generated", key: "run-token-secret" }
            - name: OAX_RUN_TOKEN_TTL_SECONDS
              value: "14400"
            - name: OAX_PROVIDERS
              value: "[{\"kind\":\"simulated\",\"name\":\"simulated\"}]"
            - name: OAX_PRICE_TABLE
              value: "[]"
            - name: OAX_CONTROL_MAX_TOOL_CALLS_PER_MINUTE
              value: "30"
            - name: OAX_DEFAULT_MAX_STEPS
              value: "50"
            - name: OAX_DEFAULT_TIMEOUT_SECONDS
              value: "1800"
            - name: OAX_WEBHOOK_TOLERANCE_SECONDS
              value: "300"
            - name: OAX_WEBHOOK_MAX_BYTES
              value: "1048576"
            - name: OAX_SSE_POLL_MS
              value: "500"
            - name: OTEL_SERVICE_NAME
              value: "openagentix-api"
          
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
