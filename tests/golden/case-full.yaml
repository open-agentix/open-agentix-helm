# Source: open-agentix/templates/networkpolicy/api.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oax-open-agentix-api
  namespace: openagentix
  labels:
    helm.sh/chart: open-agentix-0.3.0
    app.kubernetes.io/name: open-agentix
    app.kubernetes.io/instance: oax
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.2.0-alpha.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: open-agentix
    team: platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: open-agentix
      app.kubernetes.io/instance: oax
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Ingress controller / load balancer.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { protocol: TCP, port: 8080 }
    # Worker pods (run-token channel for remote workers).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: open-agentix
              app.kubernetes.io/instance: oax
              app.kubernetes.io/component: worker
      ports:
        - { protocol: TCP, port: 8080 }
    # Prometheus scraping /metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 8080 }
    # Worker nodes (run Jobs) in the dedicated runs namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openagentix-runs
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    
    -
      to:
        - ipBlock:
            cidr: 10.0.0.0/24
      ports:
        - { protocol: TCP, port: 5432 }
    
    -
      ports:
        - { protocol: TCP, port: 6379 }
    
    -
      ports:
      - port: 4318
        protocol: TCP
      to:
      - podSelector:
          matchLabels:
            app: otel
    
    -
      ports:
      - port: 443
        protocol: TCP
      - port: 636
        protocol: TCP
      to:
      - ipBlock:
          cidr: 0.0.0.0/0
          except:
          - 10.0.0.0/8
