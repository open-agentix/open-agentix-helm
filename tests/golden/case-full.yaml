        app.kubernetes.io/instance: oax
        app.kubernetes.io/component: ui
        app.kubernetes.io/version: "0.2.0-alpha.1"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: open-agentix
        team: platform
    spec:
      automountServiceAccountToken: false
      
      imagePullSecrets:
        - name: regcred
      securityContext:
        fsGroup: 101
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      
