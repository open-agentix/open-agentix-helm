# Source: open-agentix/templates/runners/configmap.yaml
# Runner settings and the toolbox allowlist for the v0.2 Kubernetes Job runner. The platform
# does not read this file yet; it is mounted nowhere until the runner ships.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oax-open-agentix-runner
  namespace: openagentix
  labels:
    helm.sh/chart: open-agentix-0.3.0
    app.kubernetes.io/name: open-agentix
    app.kubernetes.io/instance: oax
    app.kubernetes.io/component: runner
    app.kubernetes.io/version: "0.2.0-alpha.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: open-agentix
    team: platform
data:
  runner.json: |
    {
      "activeDeadlineSeconds": 1800,
      "containerSecurityContext": {
        "allowPrivilegeEscalation": false,
        "capabilities": {
          "drop": [
            "ALL"
          ]
        },
        "readOnlyRootFilesystem": true,
        "runAsNonRoot": true,
        "seccompProfile": {
          "type": "RuntimeDefault"
        }
      },
      "kind": "kubernetes-job",
      "namespace": "openagentix-runs",
      "podSecurityContext": {
        "fsGroup": 1000,
        "runAsGroup": 1000,
        "runAsNonRoot": true,
        "runAsUser": 1000,
        "seccompProfile": {
          "type": "RuntimeDefault"
        }
      },
      "resources": {
        "limits": {
          "memory": "512Mi"
        },
        "requests": {
          "cpu": "100m",
          "memory": "128Mi"
        }
      },
      "serviceAccountName": "openagentix-run",
      "ttlSecondsAfterFinished": 600
    }
  toolboxes.json: |
    [
      {
        "digest": "sha256:3333333333333333333333333333333333333333333333333333333333333333",
        "egress": [
          "ghcr.io"
        ],
        "image": "ghcr.io/open-agentix/toolbox-trivy",
        "name": "trivy"
      }
    ]
