spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/instance: oax
  template:
    metadata:
      annotations:
        checksum/customconfig: 01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b
        checksum/scripts: 5ab55a303f7528fcc8d2f678f7b3745bd5821d96a4140fe894e00e2edfda9367
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/instance: oax
    spec:
      serviceAccountName: default
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
        supplementalGroups:
        - 999
      initContainers:
        - name: valkey-init
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 999
            runAsNonRoot: true
            runAsUser: 999
            seccompProfile:
              type: RuntimeDefault
          image: "docker.io/valkey/valkey:9.1.2"
          imagePullPolicy: IfNotPresent
          envFrom:
          volumeMounts:
            - mountPath: /data
              name: valkey-data
            - name: scripts
              mountPath: /scripts
          command: [ "/scripts/init.sh" ]
      containers:
        - name: valkey-server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 999
            runAsNonRoot: true
            runAsUser: 999
            seccompProfile:
              type: RuntimeDefault
          image: "docker.io/valkey/valkey:9.1.2"
          imagePullPolicy: IfNotPresent
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli ping
            initialDelaySeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1
            periodSeconds: 10              
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli ping
            initialDelaySeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli ping
            initialDelaySeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
            periodSeconds: 10
          command:
            - valkey-server
          args:
            - /data/conf/valkey.conf
          envFrom:
          volumeMounts:
            - name: valkey-data
              mountPath: /data
      volumes:
        - name: scripts
          configMap:
            name: oax-valkey-scripts
            defaultMode: 0555
        - name: valkey-data
