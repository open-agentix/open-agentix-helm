        app.kubernetes.io/instance: oax
        app.kubernetes.io/component: api
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: open-agentix
    spec:
      serviceAccountName: oax-open-agentix-api
      automountServiceAccountToken: false
      
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: open-agentix
              app.kubernetes.io/instance: oax
              app.kubernetes.io/component: api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: open-agentix
              app.kubernetes.io/instance: oax
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: "ghcr.io/open-agentix/open-agentix-api:0.1.0"
